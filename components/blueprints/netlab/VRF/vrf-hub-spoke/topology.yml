message: |
  The lab contains a PE-router with three CE-routers attached to it. The
  PE-router implements a hub-and-spoke VRF with HUB_EGRESS and HUB_INGRESS
  VRFs

defaults.device: eos
provider: kne
module: [ bgp ]
plugin: [ bgp.session ]

groups:
  ce:
    device: eos
    members: [ ce_s1, ce_s2, ce_hub ]

vrfs:
  s_1:
    links: [ pe-ce_s1 ]
    export: [ hub_egress ]
    import: [ hub_ingress ]
  s_2:
    links: [ pe-ce_s2 ]
    export: [ hub_egress ]
    import: [ hub_ingress ]
  hub_ingress:
    links:
    - pe:
      ce_hub:
        bgp.as_override: True
  hub_egress:
    links: [ pe-ce_hub ]

nodes:
  pe:
    module: [ bgp, vrf ]
    bgp.as: 65000
  # Each CE must ENABLE bgp itself: netlab 26.08 makes a module attribute on a
  # node without that module a fatal IncorrectAttr (measured 2026-08-17 —
  # scotwilson's first deploy of this blueprint died at netlab create with
  # "nodes.ce_hub uses an attribute from module bgp which is not enabled").
  ce_hub:
    module: [ bgp ]
    bgp.as: 65100
  ce_s1:
    module: [ bgp ]
    bgp.as: 65101
  ce_s2:
    module: [ bgp ]
    bgp.as: 65102
