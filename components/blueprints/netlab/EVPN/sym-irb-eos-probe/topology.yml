provider: kne

bgp.as: 65000
bgp.activate.ipv4: []
gateway.protocol: anycast

vrfs:
  customer:
    evpn.transit_vni: 9999

vlans:
  red:
    mode: irb
    vrf: customer
    gateway: True
    links: [ s1-h1 ]
  blue:
    mode: irb
    vrf: customer
    gateway: True
    links: [ s2-h2 ]

nodes:
  s1:
    device: eos
    module: [ vlan, vxlan, vrf, ospf, bgp, evpn, gateway ]
  s2:
    device: eos
    module: [ vlan, vxlan, vrf, ospf, bgp, evpn, gateway ]
  h1:
    device: linux
  h2:
    device: linux

links:
- s1:
  s2:
