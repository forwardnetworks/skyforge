# Leaf-spine fabric with an EVPN/VXLAN overlay, generated by netlab's `fabric` plugin.
#
# What it builds: 2 spines (S1, S2) and 2 leaves (L1, L2), every leaf linked to every spine, OSPF as the underlay, iBGP
# EVPN as the overlay (the spines are the route reflectors), and one VLAN stretched over VXLAN (irb: an SVI on each leaf) so
# that h1 on L1 reaches h2 on L2 in the same subnet. README.md says how to scale it.
name: fabric_evpn

provider: kne

defaults:
  device: eos            # one line to change the fabric's NOS; every attribute below is vendor-neutral

# The plugin generates the nodes (L1.., S1..), the groups `leafs` and `spines`, and the leaf-to-spine links.
# It reads the `fabric:` block ONLY if it is listed here.
plugin: [ fabric ]
fabric:
  spines: 2
  leafs: 2
  link:
    pool: fabric         # the addressing pool (below) the generated links are numbered from

addressing:
  fabric:
    ipv4: 10.1.0.0/16
    prefix: 31           # /31 per leaf-spine link: size the pool for leafs x spines links

bgp.as: 65000
evpn.session: [ ibgp ]   # EVPN rides the iBGP sessions to the spines (route reflectors)

# Each role lists its FULL module set. There is deliberately no topology-level `module:` list.
#
# Why it matters: a node's own module list replaces the topology-level one, and a group list is not guaranteed to inherit
# it (upstream netlab replaces it, Skyforge adds to it). Naming the full set per role behaves the same either way.
#
#   ospf        the underlay: iBGP/EVPN sessions run between loopbacks, and only an IGP advertises them.
#               The spines need it as much as the leaves; without it the compile succeeds and no session comes up.
#   vlan,vxlan  the data plane on the leaves (where the hosts attach); the spines carry no VLANs.
#   evpn        the control plane, on both roles (the spines reflect it).
groups:
  leafs:
    module: [ ospf, bgp, vlan, vxlan, evpn ]
  spines:
    module: [ ospf, bgp, evpn ]
  hosts:
    members: [ h1, h2 ]
    device: linux

# The VLAN is in netlab's default irb mode (each leaf gets an SVI, which is what the collector needs to see the hosts attach), and it
# carries `ospf: false`. Without it netlab runs OSPF on the SVI, the leaves form adjacencies across their own VXLAN tunnel,
# learn each other's VTEP loopback through it and the fabric flaps every 30-40 s (hosts lose traffic intermittently; proven live
# 2026-11-06). Give EVERY VLAN you add the same line, or set `mode: bridge` on it when the fabric needs no gateway.
vlans:
  red:
    id: 1000
    vni: 101000
    ospf: false

nodes:
  h1:
  h2:

# Hosts attach to the GENERATED leaf names.
links:
- h1:
  L1:
    vlan.access: red
- h2:
  L2:
    vlan.access: red

validate:
  ping_l2:
    description: h1 reaches h2 across the VXLAN overlay
    wait_msg: Waiting for OSPF, the iBGP EVPN sessions and the VNI to come up
    wait: 60
    nodes: [ h1 ]
    plugin: ping('h2')
