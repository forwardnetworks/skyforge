message: |
  This topology sets up a redundant inter-VRF DHCP relay on a VXLAN-extended
  VLAN using EVPN control plane. It includes a pair of DHCP servers (running on
  Cisco CSR1000v), DHCP clients (using Cisco IOSv) and three VXLAN/EVPN-enabled
  Arista vEOS switches forming the network core.

defaults.attributes:
  link.dhcp:
    client: bool
    server: list
  node.dhcp:
    excluded: list

groups:
  dhcp_server:
    members: [ srv1,srv2 ]
    module: [ ospf ]
    config: [ dhcp-server ]
    device: cat8000v
  dhcp_client:
    members: [ cl_a, cl_b ]
    config: [ dhcp-client ]
    device: iol
  switch:
    members: [ sw1, sw2,sw3 ]
    module: [ ospf,bgp,vrf,vlan,vxlan,gateway,evpn ]
    config: [ dhcp-relay ]
    device: eos

vrfs:
  client:

vlans:
  cv1:
    gateway: True
    ospf.passive: True
    vrf: client

bgp.as: 65000
gateway.id: 1

nodes:
  srv1:
  srv2:
    dhcp.excluded: [ "172.16.0.1 172.16.0.128" ]
  # netlab 26.08 tightening: attributes of an irb VLAN interface must be set in
  # the node's vlans dictionary, not on the access-link interface — the relay
  # targets moved from the links below onto the switch SVIs.
  sw1:
    vlans.cv1.dhcp.server: [ srv1, srv2 ]
  sw2:
    vlans.cv1.dhcp.server: [ srv1, srv2 ]
  sw3:
  cl_a:
  cl_b:

links:
- srv1-sw3
- srv2-sw3
- sw1-sw2
- sw1-sw3
- sw2-sw3
- cl_a:
    dhcp.client: True
  sw1:
  vlan.access: cv1
- cl_b:
    dhcp.client: True
  sw2:
  vlan.access: cv1

defaults.outputs:
  _include: [ outputs/format.yml ]
