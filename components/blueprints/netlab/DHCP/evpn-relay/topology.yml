message: |
  This topology sets up an inter-VRF DHCP relay on a VXLAN-extended
  VLAN using EVPN control plane. It includes a DHCP server (running on
  Cisco CSR1000v), DHCP clients (using Cisco IOSv) and two intermediate
  VXLAN/EVPN-enabled switches running Arista vEOS.

defaults.attributes:
  link.dhcp:
    client: bool
    server: str

groups:
  dhcp_server:
    members: [ srv ]
    module: [ ospf ]
    config: [ dhcp-server ]
    device: cat8000v
  dhcp_client:
    members: [ cl_a, cl_b ]
    config: [ dhcp-client ]
    device: iol
  switch:
    members: [ sw1, sw2 ]
    module: [ ospf,bgp,vrf,vlan,vxlan,gateway,evpn ]
    config: [ dhcp-relay ]
    device: eos

vrfs:
  client:

vlans:
  cv1:
    gateway: True
    ospf.passive: True
    vrf: client

bgp.as: 65000
gateway.id: 1

nodes:
  srv:
  # netlab 26.08 tightening: attributes of an irb VLAN interface must be set in
  # the node's vlans dictionary, not on the access-link interface — the relay
  # target moved from the links below onto the switch SVIs.
  sw1:
    vlans.cv1.dhcp.server: srv
  sw2:
    vlans.cv1.dhcp.server: srv
  cl_a:
  cl_b:

links:
- srv-sw1
- srv-sw2
- sw1-sw2
- cl_a:
    dhcp.client: True
  sw1:
  vlan.access: cv1
- cl_b:
    dhcp.client: True
  sw2:
  vlan.access: cv1

defaults.outputs:
  _include: [ outputs/format.yml ]
