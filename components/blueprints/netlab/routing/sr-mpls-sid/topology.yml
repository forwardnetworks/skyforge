#
# SR-MPLS node-SID assignment across a mixed Cisco IOS-XE / Arista EOS core.
#
module: [ sr,isis ]

# KNE deployability: a single-node ("stub") link has no far end, and KNE wires
# every link as a veth pair, so the provider rejects the topology outright.
# netlab's own remedy (docs/links.md, "additional loopbacks") turns stub links
# into loopback INTERFACES -- same node, same prefix, same address, same
# advertisement -- and removes the link. No extra device, no wire, no change to
# what this lab demonstrates.
defaults.links.stub_loopback: True

addressing:
  p2p:
    unnumbered: true
  # IPv4-only loopbacks: no Cisco IOS-XE platform in netlab declares SR-MPLS
  # for IPv6 (devices.cat8000v inherits sr.af [ipv4] from csr), so an IPv6
  # loopback pool made the SR module reject the topology outright. The lab is
  # about node-SID assignment, which this still shows end to end.

nodes:
  e1:
    device: cat8000v
  e2:
    device: eos
  c1:
    device: cat8000v
  c2:
    device: eos

links:
- e1-c1
- e1-c2
- e2-c1
- e2-c2
- e1
- e2
