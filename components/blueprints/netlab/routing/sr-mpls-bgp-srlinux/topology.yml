#
# This topology combines SR-MPLS topology with IBGP session between AS-edge devices
# and EBGP sessions with two external routers, on Nokia SR OS.
#
# The goal: test BGP-free core based on Segment Routing
#
# Was SR Linux, which Skyforge does not admit; SR OS is the Nokia NOS the
# platform pins, and netlab renders the same isis/sr/bgp intent for it.

provider: kne
defaults:
  device: sros
  # KNE deployability: a single-node ("stub") link has no far end, and KNE wires
  # every link as a veth pair, so the provider rejects the topology outright.
  # netlab's own remedy (docs/links.md, "additional loopbacks") turns stub links
  # into loopback INTERFACES -- same node, same prefix, same address, same
  # advertisement -- and removes the link. No extra device, no wire, no change
  # to what this lab demonstrates.
  links.stub_loopback: True

# SR Global Block label range: the SRGB the lab used to force onto SR Linux
# (500000/1000) is exactly what netlab's SR OS device definition already
# declares, so it comes from the device now. netlab 26.08 also made
# sr.srgb a NODE/device attribute -- a topology-level sr.srgb_range_* (the old
# spelling, re-declared through sr.extra_attributes.global) is rejected.

groups:
  core:
    members: [ c1,c2 ]
  edge:
    members: [ e1,e2 ]
  external:
    members: [ x1,x2 ]

nodes:
  # CORE (no BGP)
  c1:
    module: [ isis,sr ]
  c2:
    module: [ isis,sr ]

  # EDGE
  e1:
    module: [ isis, bgp, sr ] # JvB: in this order...
    bgp:
      as: 65000
  e2:
    module: [ isis, bgp, sr ]
    bgp:
      as: 65000

  # EXTERNAL PEERS
  x1:
    module: [ bgp ]
    # type: ixrd2
    bgp:
      as: 65001
  x2:
    module: [ bgp ]
    # type: ixrd2
    bgp:
      as: 65002

links:
# Core links
- e1-c1
- e1-c2
- e2-c1
- e2-c2

# External links
- x1-e1
- x2-e2

# Stub links
- x1
- x2
