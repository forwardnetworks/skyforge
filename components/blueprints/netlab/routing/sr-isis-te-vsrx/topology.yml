#
# SR/IS-IS TE backbone and two eBGP peers, on Juniper vJunos-router.
#
# Was vSRX, which Skyforge does not admit. vjunos-router is the Junos NOS the
# platform pins and it inherits the same junos ISIS/SR/BGP feature set.
#
# NOTE: 13 vJunos-router nodes are 13 KubeVirt VMs. This lab was already that
# heavy as vSRX; it is not a lab to launch casually.
#
---
addressing:
  p2p:
    unnumbered: true
  loopback:
    ipv6: 2001:db8:cafe::/48

defaults:
  device: vjunos-router

module: [bgp, isis, sr]

# netlab 26.08 tightening: nodes must enable the modules their (as_list-
# derived) bgp attributes use; topology `module:` no longer reaches nodes,
# and the auto-created asNNNN groups cannot carry `module` (memberless at
# check time), so an explicit group does.
groups:
  backbone:
    members: [ r1, r2, r3, r4, r5, r6, r7, r8, c1, c2, c3 ]
    module: [ bgp, isis, sr ]

bgp:
  as_list:
    65000:
      members: [r1, r2, r3, r4, r5, r6, r7, r8, c1, c2, c3]
    65100:
      members: [ext1]
    65200:
      members: [ext2]

nodes:
  ext1:
    module: [bgp]
    bgp:
      originate:
        - "172.16.0.0/19"
    loopback:
      ipv4: 172.16.1.1/32
    id: 21
  ext2:
    module: [bgp]
    bgp:
      originate:
        - "172.17.0.0/19"
    loopback:
      ipv4: 172.17.1.1/32
    id: 22
  r1:
    id: 1
  r2:
    id: 2
  r3:
    id: 3
  r4:
    id: 4
  r5:
    id: 5
  r6:
    id: 6
  r7:
    id: 7
  r8:
    id: 8
  c1:
    id: 11
  c2:
    id: 12
  c3:
    id: 13

links:
  - ext1:
    r1:
    prefix: 10.10.10.0/24
  - r1-r2
  - r1-r8
  - r1:
    c1:
    isis:
      metric: 100
  - r2:
    c1:
    isis:
      metric: 100
  - r8:
    c1:
    isis:
      metric: 100
  - c1:
    r3:
    isis:
      metric: 100
  - c1:
    r7:
    isis:
      metric: 100
  - c1-c2
  - r3:
    c2:
    isis:
      metric: 100
  - r7:
    c2:
    isis:
      metric: 100
  - c2:
    r4:
    isis:
      metric: 100
  - c2:
    r6:
    isis:
      metric: 100
  - c2-c3
  - r4:
    c3:
    isis:
      metric: 100
  - r6:
    c3:
    isis:
      metric: 100
  - r4-r5
  - r6-r5
  - c3:
    r5:
    isis:
      metric: 100
  - r5:
    ext2:
    prefix: 10.10.11.0/24
