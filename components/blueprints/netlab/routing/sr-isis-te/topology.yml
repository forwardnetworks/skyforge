#
# Inspired by https://derekcheung.medium.com/segment-routing-b69f6ea2e3f5
# this topology demonstrates SR-ISIS between SROS devices,
# including Loop-Free-Alternative and MPLS-TE use cases
#
# The goal: demonstrate the power of networking
#
# THE MACSEC DEMONSTRATION WAS REMOVED 2026-09-10, AND SHOULD NOT BE RE-ADDED
# WITHOUT READING THIS. It never worked: `netlab create` died on every run with
#
#   IncorrectValue in initial: Error rendering template macsec.j2 for node
#   r1/device sros ... 'str object' has no attribute 'ca_name'
#
# which is the whole reason this topology could not be compiled at all. Three
# things were wrong, and only the first is fixable here:
#
#   1. macsec.j2 wanted a DICT (macsec.ca_name, .cak, .cak_name,
#      .encryption_type). The links declared `macsec: SecureLink`, a string, and
#      `attributes.interface.macsec: str` matched the string. Its own first line
#      says "assumes links are extended with MACsec parameters" and README.md
#      lists "A MACsec plugin to configure security parameters" -- THAT PLUGIN
#      WAS NEVER COMMITTED. `plugin:` below carries only epipe and mpls-te, and
#      only epipe.py and mpls-te.py exist.
#   2. Nothing in this repo records what the CA `SecureLink` should contain. The
#      CAK is key material; it is not recoverable and inventing one would be
#      fabricating a lab that looks authoritative and is not.
#   3. Even a correct template would probably target hardware that cannot do it.
#      README.md documents that MACsec on 7x50 needs specific chassis/MDA
#      combinations, and this topology asks for them ONLY under
#      providers.clab.devices.sros.provider_type. THE KNE PATH HAS NO SUCH KNOB
#      -- kne fixes the sros hardware profile in its own kubevirt profile -- so
#      on the platform this lab actually runs on, the request never arrives.
#
# macsec.j2 was deleted rather than left unreferenced, so nothing here looks
# ready to switch on. It is in git history if the parameters are ever recovered:
#   git show 3f22a93:netlab/routing/sr-isis-te/macsec.j2
# Everything else -- SR, IS-IS, MPLS-TE and the ePipe service -- is unchanged
# and verified byte-for-byte against the pre-removal render.
#

provider: kne
module: [ bfd, isis, sr ]

plugin: [ epipe, mpls-te ]

defaults:
  # custom_link_types: [ epipe ]
  device: sros
  # netlab 26.08 tightening: undeclared interface attributes are fatal — the
  # plugin-consumed ePipe/TE attributes must be declared with types. `macsec`
  # was declared here too; it went with the MACsec removal (see the header).
  attributes.interface:
    epipe: str
    local_epipe: int
    traffic_engineering_path: list
  devices:
   sros:
    # interface_name: 1/1/{ifindex} # sr-a4 does not use connectors
    # netlab 26.08 tightening: interface_name templates use {ifindex}, not %d
    interface_name: 1/x1/1/c{ifindex} # sr-1s use connectors and XIOM
  providers:
    clab:
      devices:
        srlinux:
          provider_type: ixr6  # Need IXR for MPLS support
        sros:
          # KEPT DELIBERATELY after the MACsec removal: the `-macsec` suffix is
          # now vestigial, but this is the CHASSIS the lab is built around and
          # `interface_name: 1/x1/1/c{ifindex}` above is written for its
          # connectors. Changing it renames every interface in the topology.
          # clab-only in any case; the KNE path ignores provider_type entirely.
          provider_type: sr-1s-macsec

addressing:
  lan:
    ipv4: 192.168.1.0/24 # "Must be longer than /24"

isis.bfd.ipv4: True

groups:
  # netlab 26.08 tightening: user-defined groups can no longer be named after
  # devices (sros/srlinux), and nodes must enable the modules their attributes
  # use; topology-level `module:` no longer reaches nodes here.
  sros_edge:
    members: [ r1,r4 ]
    module: [ bfd, isis, sr ]
    config: [ sdp-epipe.j2 ]
  sros_core:
    members: [ r2,r3 ]
    module: [ bfd, isis, sr ]
  hosts:
    members: [ h1,h2 ]

nodes:
  # Edge router
  r1:
    device: sros
    config: [ mpls-te-path.j2 ]

  # Core routers (future SRL), need sros for SR-TE and Adj SIDs
  r2:
    device: sros
  r3:
    device: sros
  r4:
    device: sros

  # Hosts connected via L2 ePipe
  h1:
    device: linux
    module: []
  h2:
    device: linux
    module: []

links:
# Core links
- r1-r2
- r1-r3
- r2-r3
- r2-r4
- r3-r4

# R1 side
- type: lan
  # role: lan cannot use this, assigns different prefixes from pool
  prefix: 192.168.1.0/24
  r1:
    ipv4: False
    local_epipe: 1
  h1:
    ipv4: 1 # Relative IP addressing offset into prefix

- interfaces:
  - node: r1
    epipe: r4
    traffic_engineering_path: [ r3, r2, r4 ]
  - node: r1
    local_epipe: 1
  prefix: False

# R4 side
- type: lan
  # role: lan
  prefix: 192.168.1.0/24
  r4:
    ipv4: False
    local_epipe: 1
  h2:
    ipv4: 2

- interfaces:
  - node: r4
    epipe: r1
  - node: r4
    local_epipe: 1
  prefix: False

# Could model ePipe service as a special type of 'link', but custom types not allowed
# Also, this does not make the association with the port on which h1/h2 are connected
# - type: epipe
#   r1:
#     ipv4: 10.0.0.1/32 # TODO get from loopback.ipv4
#   r4:
#     ipv4: 10.0.0.4/32 # TODO get from loopback
