#
# Baseline OSPF+BGP topology
#
# Anycast nodes are in AS 65101, core network is AS 65000
# Anycast prefixes are advertised via EBGP
#

module: [ ospf, bgp ]

# DECLARED INSIDE the defaults block, not as a sibling `defaults.*` key.
#
# This was `defaults.bgp.attributes.node.anycast:` written ABOVE the `defaults:`
# mapping below. netlab reads topologies with Box(box_dots=True), and mixing the
# dotted form with a dict block FOR THE SAME OBJECT loses one of them: whichever
# comes first is silently discarded. netlab's duplicate-key loader cannot catch
# it because the two literal keys differ.
#
# The result was not subtle -- the attribute declaration vanished, so the
# `bgp.anycast` use in groups.as65101 below had nothing to validate against and
# `netlab create` failed outright:
#
#   IncorrectAttr in bgp: Invalid bgp node_group attribute 'anycast' found in
#   topology.groups.as65101.bgp
#
# Verified 2026-08-18 by rendering this file on the platform's own netlab image,
# before and after. Upstream documents the hazard (blog.ipspace.net,
# 2026-08-12) and notes a fix exists but is UNMERGED; we ship Box 7.3.2, which
# still has it. Dotted keys are fine -- 60% of our topologies use them -- as
# long as they never share an object with a dict block.
#
# STILL BROKEN, and NOT by this change. With the declaration restored, create
# now reaches a SECOND, pre-existing defect that the first error was masking:
#
#   IncorrectAttr in nodes: nodes.s1 uses an attribute from module bgp which is
#   not enabled in nodes.s1   (same for a1, a2, a3)
#
# The top-level `module: [ospf, bgp]` is not reaching these nodes, which are
# declared as a bare list with their BGP membership expressed only through
# bgp.as_list. This is upstream example content and nothing on the platform
# launches it, so it is left as found rather than redesigned here -- but it does
# NOT render, and the note above should not be read as a claim that it does.
defaults:
  device: iosv
  bgp.attributes.node.anycast: { type: ipv4, use: prefix }

bgp:
  as_list:
    65000:
      members: [ l1, l2, l3, s1 ]
      rr: [ s1 ]
    65101:
      members: [ a1,a2,a3 ]

groups:
  as65000:
    config: [ bgp-addpath/ios.j2 ]
  as65101:
    config: [ bgp-anycast/ios.j2 ]
    bgp.anycast: 10.42.42.42/32
    bgp.advertise_loopback: False

nodes: 
  [ l1, l2, l3, s1, a1, a2, a3 ]

links: [ s1-l1, s1-l2, s1-l3, l2-a1, l2-a2, l3-a3 ]
