defaults.device: iol                    # Change to your IOS device (ex: iosv, csr, cat8000v)
provider: kne

module: [ bgp ]
bgp.advertise_loopback: False

groups:
  isp_b:
    members: [ r1, r2 ]
    module: [ bgp, ospf ]
    bgp.as: 64510

nodes:
  # netlab 26.08 tightening: a node using module attributes must enable the
  # module itself (topology-level `module:` no longer reaches nodes here).
  ispa:
    module: [ bgp ]
    bgp.as: 64500
    bgp.originate: 10.6.6.0/24
  r1:
  r2:
  custa:
    module: [ bgp ]
    bgp.as: 65000
    bgp.originate: 10.8.8.0/24
  custb:
    module: [ bgp ]
    bgp.as: 65100
    bgp.originate: 10.9.9.0/24

links: [ ispa-r1, r1-r2, r1-custa, r2-custb ]
