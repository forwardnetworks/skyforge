defaults.device: eos

module: [ ospf, mpls, bgp ]
bgp.as: 65000
mpls.ldp:
  explicit_null: True
mpls.bgp:
  ipv4: True
  explicit_null: True

nodes:
  # netlab 26.08 tightening: a node using module attributes must enable the
  # module itself (topology-level `module:` no longer reaches nodes here).
  pe1:
    module: [ ospf, mpls, bgp ]
  pe2:
    module: [ ospf, mpls, bgp ]
  p:
    module: [ ospf, mpls ]
    mpls.bgp: False
  rr:
    module: [ ospf, mpls, bgp ]
    bgp.rr: True
  ce1:
    module: [ ospf, mpls, bgp ]
    bgp.as: 65101
    mpls.bgp: False
  ce2:
    module: [ ospf, mpls, bgp ]
    bgp.as: 65102

links:
- pe1-ce1
- pe2-ce2
- pe1-p
- pe2-p
- rr-p
