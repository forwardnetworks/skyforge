message: |
  The "OSPF Summary LSA Loop Prevention" lab is started and configured. Use
  "netlab status" to display the devices in the lab and "netlab connect" to
  connect to them.

module: [ ospf ]
provider: kne
defaults.device: eos
addressing.p2p.ipv4: True

nodes:
  # netlab 26.08 tightening: a node using module attributes must enable the
  # module itself (topology-level `module:` no longer reaches nodes here).
  s1:
    module: [ ospf ]
    ospf.area: 1
    loopback.ipv4: 192.168.0.1/32
  s2:
    module: [ ospf ]
    ospf.area: 1
    loopback.ipv4: 192.168.0.2/32
  a1:
    module: [ ospf ]
    ospf.area: 0
  a2:
    module: [ ospf ]
    ospf.area: 0
  r2:
    module: [ ospf ]
    ospf.area: 2
  r3:
    module: [ ospf ]
    ospf.area: 3

links:
- group: backbone
  ospf.area: 0
  members: [ a1-a2 ]
- group: area_1
  ospf.area: 1
  members: [ s1-a1, s2-a2, s1-s2 ]
- group: area_2
  ospf.area: 2
  members: [ r2-a1 ]
- group: area_3
  ospf.area: 3
  members: [ r3-a2 ]
