# expect: none
# An external VLAN (role: external) carries no routing protocol, so there is no OSPF on its SVI.
defaults.device: eos
bgp.as: 65000
vlans:
  red:
    role: external
groups:
  leafs:
    members: [ l1, l2 ]
    module: [ ospf, bgp, vlan, vxlan, evpn ]
nodes:
  l1:
  l2:
  h1:
    device: linux
  h2:
    device: linux
links:
- l1-l2
- h1:
  l1:
    vlan.access: red
- h2:
  l2:
    vlan.access: red
