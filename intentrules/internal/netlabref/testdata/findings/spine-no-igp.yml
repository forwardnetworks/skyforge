# expect: ibgp-without-igp
# Spines list bgp+evpn but no IGP: iBGP/EVPN sessions have nothing to ride on.
provider: clab
defaults.device: eos
plugin: [ fabric ]
fabric.spines: 2
fabric.leafs: 2
fabric.link.pool: core
addressing:
  core: { ipv4: 10.1.0.0/16, prefix: 31 }
bgp.as: 65000
evpn.session: [ ibgp ]
groups:
  spines:
    module: [ bgp, evpn ]
  leafs:
    module: [ ospf, bgp, vlan, vxlan, evpn ]
